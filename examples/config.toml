# Compatible with Boring's tunnel configuration format.
# SSH aliases and authentication come from ~/.ssh/config and ssh-agent.
keep_alive = 30
reconnect_timeout = 900

[[tunnels]]
name = "dev-db"
group = "development"
host = "dev-server"
local = 5433
remote = "127.0.0.1:5432"

[[tunnels]]
name = "dev-web"
group = "development"
host = "dev-server"
local = "127.0.0.1:8080"
remote = "127.0.0.1:3000"

[[tunnels]]
name = "reverse-web"
host = "dev-server"
mode = "remote"
local = "127.0.0.1:3000"
remote = 8081

[[tunnels]]
name = "proxy"
host = "dev-server"
mode = "socks"
local = 1080

[[tunnels]]
name = "reverse-proxy"
host = "dev-server"
mode = "socks-remote"
remote = 1081

