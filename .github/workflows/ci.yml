name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/fixture/go.mod
          cache-dependency-path: tests/fixture/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Build loopback SSH test server
        working-directory: tests/fixture
        run: go build -o ../../target/ssh-fixture .
      - name: Real SSH integration tests
        run: python3 -u tests/e2e.py
      - run: cargo build --locked --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - run: cargo check --locked --all-targets
